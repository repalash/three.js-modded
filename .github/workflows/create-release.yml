# .github/workflows/create-release.yml of a single-package repository with a build step.
# Each version gets a GitHub release publish@<version> with the tarball.
name: Publish to npm

on:
  push:
    # lane/rNNN: a three.js upgrade lane publishes prerelease versions under its own dist-tag (lane-guard below)
    branches: [master, 'lane/r*']
  workflow_dispatch:

permissions:
  contents: read

# one queue per branch: a newer push waits until the one before is approved, rejected or cancelled
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # A lane branch never publishes to `latest`: a version that is not on npm yet must be a prerelease with a
  # publishConfig.tag (three-rNNN).
  lane-guard:
    if: github.ref_name != 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prerelease version with a dist-tag only
        run: |
          node --input-type=module -e "
          import {readFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const p = JSON.parse(readFileSync('package.json', 'utf8'))
          let published = false
          try { published = execFileSync('npm', ['view', p.name + '@' + p.version, 'version'], {encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore']}).trim() === p.version } catch {}
          if (!published && (!/^[^+]*-/.test(p.version) || !p.publishConfig?.tag)) { console.log('::error::' + p.name + '@' + p.version + ' would be published without a prerelease version and publishConfig.tag'); process.exit(1) }"

  release:
    needs: lane-guard
    # on master the guard is skipped
    if: ${{ !cancelled() && needs.lane-guard.result != 'failure' }}
    permissions:
      contents: write # GitHub releases
      id-token: write # npm trusted publishing
    uses: repalash/release-tools/.github/workflows/npm-release.yml@v1
    with:
      build: npm ci && npm run build
      github-release: true
    secrets: inherit
