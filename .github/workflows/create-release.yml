# .github/workflows/create-release.yml of a single-package repository with a build step.
# Each version gets a GitHub release publish@<version> with the tarball.
name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # GitHub releases
      id-token: write # npm trusted publishing
    uses: repalash/release-tools/.github/workflows/npm-release.yml@v1
    with:
      build: npm ci && npm run build
      github-release: true
    secrets: inherit
